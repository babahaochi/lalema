version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: lalema-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-lalema123}
      MYSQL_DATABASE: lalema
      MYSQL_USER: lalema
      MYSQL_PASSWORD: ${DB_PASSWORD:-lalema123}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lalema-network

  redis:
    image: redis:7-alpine
    container_name: lalema-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lalema-network

  app:
    build: .
    container_name: lalema-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/lalema?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: lalema
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-lalema123}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-lalema-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - lalema-network

  nginx:
    image: nginx:alpine
    container_name: lalema-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl/cert.pem:/etc/nginx/ssl/cert.pem:ro
      - ./ssl/cert.key:/etc/nginx/ssl/cert.key:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - lalema-network

volumes:
  mysql-data:
  redis-data:

networks:
  lalema-network:
    driver: bridge